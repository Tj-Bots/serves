{% extends "base.html" %}
{% block title %}{{ t('verify.title') }}{% endblock %}
{% block content %}
<div class="card auth-card">
    <h1>{{ t('verify.title') }}</h1>
    <p class="muted">{{ t('verify.description', email=user.email) }}</p>
    <form method="post" action="/verify-email">
        <label>{{ t('verify.code_label') }}</label>
        <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" autofocus required>
        <button type="submit" class="btn-primary">{{ t('verify.submit') }}</button>
    </form>
    <form method="post" action="/verify-email/resend" style="margin-top: 14px;">
        <button type="submit" class="btn-ghost">{{ t('verify.resend') }}</button>
    </form>
    <p class="muted">{{ t('verify.wrong_email') }} <a href="/logout">{{ t('nav.logout') }}</a></p>
</div>
{% endblock %}
