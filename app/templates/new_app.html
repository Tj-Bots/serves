{% extends "base.html" %}
{% block title %}{{ t('newapp.title') }}{% endblock %}
{% block content %}
<div class="card">
    <h1>{{ t('newapp.title') }}</h1>
    <form method="post" action="/apps/new">
        <label>{{ t('newapp.name_label') }}</label>
        <input type="text" name="name" placeholder="{{ t('newapp.name_placeholder') }}" required autofocus>

        <label>{{ t('newapp.repo_label') }}</label>
        <input type="text" name="repo_url" placeholder="https://github.com/user/my-bot" required>

        <label>{{ t('newapp.reqfile_label') }}</label>
        <input type="text" name="requirements_file" value="requirements.txt">

        <label>{{ t('newapp.runcmd_label') }}</label>
        <input type="text" name="run_command" placeholder="python bot.py" required>

        <p class="hint">{{ t('newapp.env_hint') }}</p>

        <button type="submit" class="btn-primary">{{ t('newapp.submit') }}</button>
    </form>
</div>
{% endblock %}
