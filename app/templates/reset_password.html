{% extends "base.html" %}
{% block title %}{{ t('auth.reset.title') }}{% endblock %}
{% block content %}
<div class="card auth-card">
    <h1>{{ t('auth.reset.title') }}</h1>
    <p class="muted">{{ t('auth.reset.description') }}</p>
    <form method="post" action="/reset-password">
        <label>{{ t('verify.code_label') }}</label>
        <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" autofocus required>

        <label>{{ t('account.new_password') }}</label>
        <input type="password" name="new_password" minlength="8" required>

        <label>{{ t('account.new_password_confirm') }}</label>
        <input type="password" name="new_password_confirm" minlength="8" required>

        <button type="submit" class="btn-primary">{{ t('auth.reset.submit') }}</button>
    </form>
    <form method="post" action="/reset-password/resend" style="margin-top: 14px;">
        <button type="submit" class="btn-ghost">{{ t('verify.resend') }}</button>
    </form>
</div>
{% endblock %}
