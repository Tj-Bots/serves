{% extends "base.html" %}
{% block title %}{{ t('auth.login.title') }}{% endblock %}
{% block content %}
<div class="card auth-card">
    <h1>{{ t('auth.login.title') }}</h1>
    <form method="post" action="/login">
        <label>{{ t('form.email') }}</label>
        <input type="email" name="email" value="{{ email or '' }}" required autofocus>

        <label>{{ t('form.password') }}</label>
        <input type="password" name="password" required>

        <button type="submit" class="btn-primary">{{ t('auth.login.submit') }}</button>
    </form>
    <p class="muted"><a href="/forgot-password">{{ t('auth.login.forgot_password') }}</a></p>
    <p class="muted">{{ t('auth.login.no_account') }} <a href="/signup">{{ t('nav.signup') }}</a></p>
</div>
{% endblock %}
